name: GROKBOT Paper Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: grokbot-paper
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run paper trading bot
        run: node bot-runner.cjs

      - name: Save paper trading state
        run: |
          if [ -f bot-state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bot-state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update GROKBOT paper state"
              git push
            fi
          fi
      - name: GROKBOT safety test
        run: node grokbot-safety-test.cjs
